services:
  bibliotheque:
    build: .
    container_name: bibliotheque
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Définis APP_PASSWORD dans le fichier .env}
      MCP_TOKEN: ${MCP_TOKEN:?Définis MCP_TOKEN dans le fichier .env}
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - bibliotheque-data:/data

volumes:
  bibliotheque-data:
